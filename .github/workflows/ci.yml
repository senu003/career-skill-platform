name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-verification:
    name: Backend Test Suite & Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: career_skill_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/career_skill_test_db
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-key-256bits-min-length-required-for-hs256
      GEMINI_API_KEY: dummy-api-key-for-ci
      GEMINI_MOCK: "1"
      STORAGE_BACKEND: local
      RUN_RUNTIME_DDL: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Verify Alembic fresh database upgrade to head
        run: |
          cd backend
          python scripts/run_migrations.py

      - name: Run backend automated test suite
        run: |
          cd backend
          pytest tests -v --tb=short

  frontend-verification:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend lint
        run: |
          cd frontend
          npm run lint

      - name: Run frontend production build
        run: |
          cd frontend
          npm run build

  docker-verification:
    name: Docker Images Build & Compose Validation
    needs: [backend-verification, frontend-verification]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build backend Docker image
        run: docker build -t career-skill-backend:ci ./backend

      - name: Build frontend Docker image
        run: docker build -t career-skill-frontend:ci ./frontend
